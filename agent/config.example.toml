# 飞行图书馆 · agent 运行配置
# 所有相对路径都相对项目根（agent 的上一级）
#
# ─────────────────────────────────────────────────────────────────
# 【AI 调用怎么配】三种情况，选一种改就行，改完不用重启任何服务。
#
#  A. 用 OpenAI 官方
#     1) 设环境变量： setx OPENAI_API_KEY "sk-..."   （开新终端生效）
#     2) 下面的 base_url / model 保持不动（默认 gpt-4o-mini）
#     3) 验证： .venv\Scripts\python.exe -m agent run ai bio --dry
#
#  B. 用其它 OpenAI 兼容服务（硅基流动 / DeepSeek / 智谱 / 本地 vLLM / one-api）
#     只改四行：
#       base_url = "https://api.deepseek.com/v1"      # 对方的 /v1 端点
#       model    = "deepseek-chat"                    # 对方模型名
#       price_in_per_mtok / price_out_per_mtok        # 改成本价，否则记账是错的
#       api_key_env 指向你设的那个环境变量名，或直接写 api_key = "..."
#     ⚠ 对方必须支持 response_format={"type":"json_schema"}；
#       只支持 json_object 的服务会让 chat_json 报 400，换服务或改用 json_object。
#
#  C. 不想用环境变量
#     直接写 key（别提交到 git；agent/state 与 config 里的 key 都已在 .gitignore 之外，
#     提交前务必确认）：
#       api_key = ""                      # 在这里填你的 key（或改用下面的 api_key_env）
#
#  花费与熔断：每笔调用按 token × 单价记进 agent/state/ledger.db，
#  单次运行超 max_usd_per_run 立即抛 BudgetExceeded 停下。
#  查账： python -m agent cost 10
#        sqlite3 agent/state/ledger.db "SELECT tag,SUM(cost_usd) FROM ai_calls GROUP BY tag ORDER BY 2 DESC"
# ─────────────────────────────────────────────────────────────────

[paths]
root = ".."
canon = "校勘版"              # 交付层正文（S2+S3 成品）
proof = "校对后文章"          # S1 排版层
source = "原文"               # 冻结源库，只读
db = "采集工具/书库/data/library.db"
state = "state"               # 台账与运行日志（相对 agent/）
artifacts = "state/artifacts" # AI 产物落盘

[llm]
# 当前接的是 DeepSeek 官方（OpenAI 兼容端点）
base_url = "https://api.deepseek.com/v1"   # 换 provider 只改这一行（末尾要带 /v1）
model = "deepseek-chat"                     # deepseek-chat（V3 通用）或 deepseek-reasoner（R1）
api_key = ""                      # 在这里填你的 key（或改用下面的 api_key_env）     # 直接写在配置里；已设置则优先于 api_key_env
api_key_env = "DEEPSEEK_API_KEY"            # 若想把 key 放环境变量，填这里、留空 api_key
temperature = 0.7                           # 写小传/简介用 0.7；校对类可降到 0.2
max_tokens = 3000                           # 单次回复上限；bio 一次写 10 个角色够用
timeout = 120                               # 单次请求超时（秒）
max_retries = 3                             # 只对 429 / 超时 / 5xx 重试，退避 2s→4s→8s
concurrency = 6                             # 同时在飞的请求数；被限流就降到 2–3
# 单价（美元 / 百万 token），用于记账。DeepSeek 官方现价（以官网为准，变价要改）：
#   输入 缓存未命中 $0.28 / 命中 $0.07，输出 $1.10
price_in_per_mtok = 0.28
price_out_per_mtok = 1.10
# 单次运行的花费上限，超出立即停（0 = 不限）
max_usd_per_run = 5.0
# 结构化输出约束方式。**DeepSeek 只认 json_object**：传 json_schema 会 400
# 「This response_format type is unavailable now」（已实测）。
# 换回 OpenAI 官方可改成 json_schema（服务端按 schema 强约束，更稳）。
json_mode = "json_object"

[run]
log_dir = "state/logs"
keep_days = 30
# 幂等：同一 stage + 同一输入指纹就不再跑。改代码/改 prompt 会让 key 变，自然重跑
idempotent = true

[stages]
# 记录每段的处理方式（实际值以 stages/*.py 里 Stage.kind 为准，这里只做速查）
#   script  规则能可靠覆盖，直接调现有脚本
#   ai      必须读上下文才能判，走 API
#   hybrid  脚本先跑，AI 只处理脚本判不了的疑难样本
collect = "script"
dedupe_source = "script"
clean = "script"
reflow = "script"
fix_glyph = "script"
fix_punct = "script"
restore_titles = "script"
build_db = "script"
chapters = "script"
dedupe_chapters = "script"
merge_works = "script"
classify_source = "script"
meta = "script"
characters = "script"
fts = "script"
check = "script"
audit_chars = "hybrid"
text_proof = "hybrid"
bio = "ai"
summary = "ai"
